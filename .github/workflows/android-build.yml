name: Android build

# Android 앱이 컴파일되는지 확인 (CI 전용 임시 서명 키로 release APK 빌드)
# 실제 서명 키, gradle.properties, Google Maps 키는 저장소에 없으므로 CI에서 임시 값을 만든다.
on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'react-native.config.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Fix old Android libraries for AGP 8+ (CI only)
        run: python3 .github/scripts/fix-android-libs.py .

      - name: Create CI-only gradle.properties and signing key
        working-directory: android
        run: |
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          reactNativeArchitectures=arm64-v8a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=true
          android.builtInKotlin=false
          android.newDsl=false
          HIKER_RELEASE_STORE_FILE=ci-release.keystore
          HIKER_RELEASE_STORE_PASSWORD=android
          HIKER_RELEASE_KEY_ALIAS=ci
          HIKER_RELEASE_KEY_PASSWORD=android
          PROPS
          keytool -genkeypair -v -keystore app/ci-release.keystore -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"
          keytool -genkeypair -v -keystore app/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Android Debug"

      - name: Build release APK
        working-directory: android
        run: |
          if ! ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            echo "===== errors ====="
            grep -n -E "error:|e: |FAILURE|What went wrong" -A6 build.log | head -200
            echo "===== tail ====="
            tail -n 60 build.log
            exit 1
          fi
          tail -n 5 build.log
          grep -c "com.android.vending.BILLING" app/build/intermediates/merged_manifests/release/*/AndroidManifest.xml 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore
