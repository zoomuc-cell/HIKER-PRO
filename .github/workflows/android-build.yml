name: Android build

# Android 앱이 컴파일되는지 확인 (CI 전용 임시 서명 키로 release APK 빌드)
# 실제 서명 키, gradle.properties, Google Maps 키는 저장소에 없으므로 CI에서 임시 값을 만든다.
on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'react-native.config.js'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 업로드 키가 있으면 긴 빌드 전에 먼저 풀어서 비밀번호·별칭이 맞는지 확인한다
      - name: Check upload key
        if: env.HAS_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Play 빌드에 지도 키가 없으면 지도가 빈 화면이 된다 (긴 빌드 전에 먼저 확인)
          [ -n "$(printf '%s' "$MAPS_KEY" | tr -d ' \r\n\t')" ] \
            || { echo "::error::MAPS_API_KEY secret is missing: the map would be blank"; exit 1; }
          # 붙여넣을 때 섞인 줄바꿈·공백(윈도우 CR 포함)은 지운 뒤 푼다
          printf '%s' "$KEY_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          # 키 저장소·별칭·비밀번호가 맞는지 확인하고, Play Console 업로드 키와 비교할 SHA-1 을 출력
          # 앞뒤에 실수로 들어간 공백·줄바꿈은 지운다
          KS_PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" > ks.txt 2>&1; then
            echo "::error::Keystore password is wrong (ANDROID_KEYSTORE_PASSWORD)"; sed 's/^/  /' ks.txt | head -5; exit 1
          fi
          echo "Aliases in this keystore:"; grep -i "entry" ks.txt | cut -d, -f1 | sed 's/^/  /'
          if ! keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > alias.txt 2>&1; then
            echo "::error::Alias not found (ANDROID_KEY_ALIAS)"; head -3 alias.txt; exit 1
          fi
          grep -E "SHA1:|SHA256:" alias.txt
          rm -f ks.txt alias.txt

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Fix old Android libraries for AGP 8+ (CI only)
        run: python3 .github/scripts/fix-android-libs.py .

      - name: Create CI-only gradle.properties and signing key
        working-directory: android
        run: |
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          reactNativeArchitectures=arm64-v8a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=true
          android.builtInKotlin=false
          android.newDsl=false
          HIKER_RELEASE_STORE_FILE=ci-release.keystore
          HIKER_RELEASE_STORE_PASSWORD=android
          HIKER_RELEASE_KEY_ALIAS=ci
          HIKER_RELEASE_KEY_PASSWORD=android
          PROPS
          keytool -genkeypair -v -keystore app/ci-release.keystore -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"
          keytool -genkeypair -v -keystore app/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Android Debug"

      - name: Build release APK
        working-directory: android
        run: |
          if ! ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            echo "===== errors ====="
            grep -n -E "error:|e: |FAILURE|What went wrong" -A6 build.log | head -200
            echo "===== tail ====="
            tail -n 60 build.log
            exit 1
          fi
          tail -n 5 build.log
          grep -c "com.android.vending.BILLING" app/build/intermediates/merged_manifests/release/*/AndroidManifest.xml 2>/dev/null || true

      # 업로드 키가 저장소 Secrets 에 있으면 Google Play 에 올릴 서명된 .aab 를 만든다.
      # 필요한 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Signed bundle (.aab for Google Play)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # 지도(Google Maps) 키가 없으면 지도가 빈 화면이 되므로 빌드를 멈춘다
          MAPS_KEY="$(printf '%s' "$MAPS_KEY" | tr -d ' \r\n\t')"
          [ -n "$MAPS_KEY" ] || { echo "::error::MAPS_API_KEY secret is missing: the map would be blank"; exit 1; }
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          KS_PASS="$(trim "$KS_PASS")"; KEY_ALIAS="$(trim "$KEY_ALIAS")"; KEY_PASS="$(trim "$KEY_PASS")"
          ./gradlew --no-daemon bundleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -PHIKER_RELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" \
            -PHIKER_RELEASE_STORE_PASSWORD="$KS_PASS" \
            -PHIKER_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PHIKER_RELEASE_KEY_PASSWORD="$KEY_PASS" \
            -PMAPS_API_KEY="$MAPS_KEY" > bundle.log 2>&1 || { tail -n 80 bundle.log; exit 1; }
          cp app/build/outputs/bundle/release/app-release.aab ../HIKERPRO.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload signed bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HIKERPRO-play-bundle
          path: HIKERPRO.aab
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore

      # 코드가 올라오면 휴대폰에 바로 설치할 수 있는 테스트 앱을 "test-latest" 릴리스로 올린다.
      # 패키지 이름이 com.hikerpro.app.test 라서 스토어 앱과 따로 깔리고 기존 기록도 그대로 남는다.
      - name: Test APK for phone
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">HIKER 테스트</string>|' app/src/main/res/values/strings.xml
          MAPS_KEY="$(printf '%s' "$MAPS_KEY" | tr -d ' \r\n\t')"
          ./gradlew --no-daemon assembleRelease -PHIKER_TEST_BUILD=true \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -PMAPS_API_KEY="$MAPS_KEY" > test-apk.log 2>&1 || { tail -n 80 test-apk.log; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../hikerpro-test.apk
          git checkout -- app/src/main/res/values/strings.xml

      - name: Publish test release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: 테스트용 최신 버전 (안드로이드)
          prerelease: true
          make_latest: false
          body: |
            최신 코드로 자동으로 만든 테스트용 안드로이드 앱입니다 (HIKER 테스트).
            휴대폰에서 아래 hikerpro-test.apk 를 눌러 받아 설치하세요. 스토어 앱과 따로 설치됩니다.
            빌드 커밋: ${{ github.sha }}
          files: hikerpro-test.apk
