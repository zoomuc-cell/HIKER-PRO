name: iOS build

# iOS 앱이 컴파일되는지 확인 (서명 없이 시뮬레이터용으로 빌드)
on:
  push:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'react-native.config.js'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          if ! xcodebuild \
            -workspace HikerPro.xcworkspace \
            -scheme HikerPro \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1; then
            echo "===== errors ====="
            grep -n -E ":[0-9]+:[0-9]+: (fatal )?error: |^error: |ld: |clang: error" -A2 build.log | head -150
            grep -n -A8 "The following build commands failed" build.log
            echo "===== tail ====="
            tail -n 40 build.log
            exit 1
          fi
          tail -n 5 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
